name: Fairwall AI Voice Bot Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  APP_NAME: ai-voice-bot
  PYTHON_VERSION: "3.10"

jobs:

  gate-check:
    name: 🔎 System Gate Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run System Check
        run: |
          if [ -f voice_system_check.py ]; then
            python voice_system_check.py
          else
            echo "voice_system_check.py not found, skipping..."
          fi

      - name: Verify TTS/STT Import Gate
        run: |
          python - <<EOF
          try:
              import pyttsx3
              import speech_recognition
              print("TTS & STT verified ✅")
          except ImportError as e:
              print(f"Import failed: {e}")
              exit(1)
          EOF

  build:
    name: 🏗 Build Stage
    needs: gate-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t $APP_NAME:latest .

      - name: Save Docker Image
        run: docker save $APP_NAME:latest -o image.tar

      - name: Upload Docker Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  deploy:
    name: 🚀 Deploy Stage
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Docker Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker Image
        run: docker load -i image.tar

      - name: Deploy Container
        run: |
          docker run -d -p 5000:5000 --name ai_voice_bot $APP_NAME:latest

      - name: Deployment Verification
        run: |
          docker ps | grep ai_voice_bot
          echo "Deployment Successful 🎉"
